name: Feature request
description: Suggest an idea for CamStudio Pro
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How should it work? Mockups and examples from other apps are welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Android app, Windows app, Live streaming, Recording, Editor, Effects, Other]
